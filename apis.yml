aid: imperfect
name: Imperfect
description: Imperfect (Imperfect Wellness, Inc.) is a San Francisco-based, Y Combinator-backed (Spring 2026)
  consumer startup building an adaptive AI training coach for endurance athletes across cycling, trail running,
  swimming, and other sports. The mobile app connects to a user's wearables and health apps to generate
  real-time training, recovery, and nutrition recommendations that adapt to how the athlete's body is
  actually responding day to day, rather than following a static plan written weeks in advance. Founded by
  Matin Tamizi (previously built and sold two fintech companies and authored a widely used open-source Garmin
  library used by Stanford Health). Imperfect ships as a consumer mobile application (Google Play) and publishes
  no public developer API, SDK, or developer portal at this time.
